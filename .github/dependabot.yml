version: 2
updates:
  # ── Backend Python deps ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5   # was 10 — each open PR fans out to 3 workflows
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # numpy 2.5+ requires Python >=3.12, but this project targets 3.11
      # (backend/.python-version, backend/Dockerfile, CI). The 2.4.6 -> 2.5.3
      # bump in #70 broke `docker build` and CI because the project is 3.11.
      # Keep numpy on the 3.11-compatible line until Python is bumped.
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    labels:
      - dependencies
      - backend

  # ── Frontend npm deps ──────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5   # was 10 — each open PR fans out to 3 workflows
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - frontend

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3   # was 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci
