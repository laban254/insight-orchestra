name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1" # weekly, Monday 04:27 UTC

# Supersede an in-flight run for the same ref rather than running both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bandit:
    name: Python security lint (bandit)
    # Advisory (continue-on-error) and already covered by the weekly schedule.
    # No gating value on a PR, so keep it off the PR path.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'
      - name: Run bandit
        # Non-blocking: surfaces security findings without failing the build.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip bandit
          bandit -r backend/app -ll

  pip-audit:
    name: Python dependency audit
    # Advisory (continue-on-error); the weekly schedule already runs it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'
      - name: Run pip-audit
        # Non-blocking for now: report vulnerabilities without failing the build.
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --desc

  npm-audit:
    name: Frontend dependency audit
    # Advisory (continue-on-error); the weekly schedule already runs it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run npm audit
        # Non-blocking for now: high+ vulnerabilities are surfaced as warnings.
        continue-on-error: true
        run: npm audit --audit-level=high
