name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer run on the same ref supersedes an in-flight one — cancel the old
# instead of paying for both. Without this, every force-push and Dependabot
# rebase re-runs the whole matrix on top of the previous, still-running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast guard: fail in seconds if a pinned dependency can't resolve on the
  # project's Python version, rather than minutes into the full test install or
  # the Docker build. This is the check that should have caught numpy 2.5.3
  # (which requires Python >=3.12 while this project targets 3.11).
  deps:
    name: Backend deps resolve (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'
          cache: 'pip'

      - name: Verify backend/requirements.txt resolves
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r backend/requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.11.13  # keep in sync with .pre-commit-config.yaml's ruff-pre-commit rev

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          pytest tests/ --cov=backend --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: 'backend/.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests

      - name: Run MyPy
        run: |
          mypy backend/app/ --ignore-missing-imports

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  docker:
    # The image builds are the heaviest jobs here and only change with the
    # Dockerfiles/deps, so they run on main (and on release via
    # publish-images.yml). On pull requests the steps are skipped — the
    # `frontend` job already runs `npm run build` — but the job itself still
    # runs so a required "docker" status check keeps reporting instead of
    # sitting at "Expected".
    runs-on: ubuntu-latest
    needs: [deps, lint, test, type-check, frontend]
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v7

      - if: github.event_name == 'push'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - if: github.event_name == 'push'
        name: Build Backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: insight-orchestra:backend
          load: true
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - if: github.event_name == 'push'
        name: Build Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: insight-orchestra:frontend
          load: true
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

      - if: github.event_name == 'push'
        name: Verify Docker images
        run: |
          docker images insight-orchestra
