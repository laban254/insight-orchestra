
x-logging: &default-logging
  driver: local

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - USE_REDIS=true
      - REDIS_URL=redis://redis:6379
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8501,http://localhost:3000,http://127.0.0.1:8501,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/uploads:/home/appuser/uploads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
      - FRONTEND_PORT=8501
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    logging: *default-logging

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
  ollama_data:
  redis_data:

networks:
  default:
    name: insight-orchestra-network
